<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng nhập • Tiệm Len</title>
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/account.css" />
  </head>
  <body>
    <div class="notice">Một chút len, một khoảng bình yên ♡</div>
    <main class="wrap account-wrap">
      <header>
        <a class="logo" href="/"><span aria-hidden="true">❋</span> tiệm len</a
        ><a class="back-to-shop" href="/#san-pham">← Về cửa hàng</a>
      </header>
      <section class="auth-card" aria-labelledby="authTitle">
        <div class="eyebrow">Góc nhỏ của bạn</div>
        <h1 id="authTitle">Chào mừng bạn trở lại</h1>
        <p class="help">Đăng nhập để tiếp tục chọn len và xem đơn hàng của bạn.</p>
        <form id="authForm" class="buyer" data-mode="login">
          <label
            >Email<input
              name="email"
              type="email"
              autocomplete="username"
              maxlength="200"
              placeholder="ban@example.com"
              required
          /></label>
          <label
            >Mật khẩu<input
              name="password"
              type="password"
              autocomplete="current-password"
              minlength="1"
              maxlength="200"
              required
          /></label>

          <p class="help form-status" id="authStatus" role="status" aria-live="polite"></p>
          <button type="submit" class="primary">Đăng nhập</button>
        </form>
        <p class="auth-switch">
          Bạn mới ghé tiệm? <a id="switchAuth" href="/register/">Đăng ký tài khoản</a>
        </p>
      </section>
    </main>
    <script type="module" src="/js/pages/auth.js"></script>
  </body>
</html>
