<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Đăng ký • Nhung Cap</title>
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/theme.css" />
    <link rel="stylesheet" href="/styles/account.css" />
  </head>
  <body>
    <div class="notice">Một chút len, một khoảng bình yên ♡</div>
    <main class="wrap account-wrap">
      <header>
        <a class="logo" href="/"><span aria-hidden="true">❋</span> Nhung Cap</a
        ><a class="back-to-shop" href="/#san-pham">← Về cửa hàng</a>
      </header>
      <section class="auth-card" aria-labelledby="authTitle">
        <div class="eyebrow">Góc nhỏ của bạn</div>
        <h1 id="authTitle">Làm quen với mình nhé</h1>
        <p class="help">Tạo tài khoản để đặt hàng và theo dõi những cuộn len của bạn.</p>
        <form id="authForm" class="buyer" data-mode="register">
          <label
            >Họ và tên<input
              name="name"
              autocomplete="name"
              minlength="2"
              maxlength="80"
              placeholder="Mình gọi bạn là gì nhỉ?"
              required
          /></label>
          <label
            >Email<input
              name="email"
              type="email"
              autocomplete="username"
              maxlength="200"
              placeholder="ban@example.com"
              required
          /></label>
          <label
            >Mật khẩu<input
              name="password"
              type="password"
              autocomplete="new-password"
              maxlength="200"
              required
          /></label>
          <label
            >Nhập lại mật khẩu<input
              name="confirmation"
              type="password"
              autocomplete="new-password"
              maxlength="200"
              required
          /></label>
          <p class="help form-status" id="authStatus" role="status" aria-live="polite"></p>
          <button type="submit" class="primary">Tạo tài khoản</button>
        </form>
        <p class="auth-switch">Đã có tài khoản? <a id="switchAuth" href="/login/">Đăng nhập</a></p>
      </section>
    </main>
    <script type="module" src="/js/pages/auth.js"></script>
  </body>
</html>
